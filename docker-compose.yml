services:
  tender-platform:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${PLATFORM_BIND:-0.0.0.0}:${PLATFORM_PORT:-8000}:8000"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
