# Replace the certificate paths and port if your deployment differs.
server {
    listen 5555 ssl;
    # Port 443 is added by the installer only when DOMAIN is configured.
    server_name _;

    ssl_certificate     /etc/sgcc-platform/tls/cert.pem;
    ssl_certificate_key /etc/sgcc-platform/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SGCC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Complete migration bundles are limited to 100 MB by the application.
    client_max_body_size 110m;

    # The FastAPI application remains the single source of administrator
    # authentication. Nginx calls this internal endpoint before proxying both
    # the dashboard and noVNC, including WebSocket upgrades.
    location = /_platform_auth {
        internal;
        proxy_pass http://127.0.0.1:8001/_internal/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Enterprise WeChat calls this endpoint without a dashboard session.  The
    # application verifies Enterprise WeChat's encrypted callback signature.
    location = /wecom/callback {
        proxy_pass http://127.0.0.1:8001/wecom/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health checks are deliberately unauthenticated.  They expose no dashboard
    # data and let the installer, load balancers and monitoring verify that the
    # application can open its database without needing administrator cookies.
    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        auth_request /_platform_auth;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
}
