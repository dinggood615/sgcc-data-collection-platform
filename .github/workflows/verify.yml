name: Verify project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt httpx pytest
      - name: Compile Python sources
        run: python -m compileall app
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check shell scripts
        run: |
          for script in install.sh install-linux.sh install-docker.sh install-browser.sh update-linux.sh manage.sh uninstall-linux.sh; do
            bash -n "$script"
          done
          dash -n install-docker.sh
          sh install-docker.sh --help
      - name: Verify portable Docker Compose configuration
        run: |
          cp .env.example .env
          DATA_DIR="$RUNNER_TEMP/platform-data" PLATFORM_PORT=18000 docker compose config --quiet
          DOMAIN=sgcc.example.com PLATFORM_BIND=127.0.0.1 DATA_DIR="$RUNNER_TEMP/platform-data" docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
          rm -f .env
      - name: Verify clean first-run state
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/clean.sqlite3"
          export APP_SECRET="ci-clean-state-secret"
          unset SMTP_HOST SMTP_PORT SMTP_USER SMTP_AUTH_CODE SMTP_FROM SMTP_TO WECOM_CORP_ID WECOM_CALLBACK_TOKEN WECOM_ENCODING_AES_KEY WECOM_ADMIN_USERS WECOM_PUBLIC_URL WECOM_WEBHOOK WECOM_PUSH_ENABLED
          python - <<'PY'
          from app.database import connect, init_db, setting
          init_db()
          with connect() as db:
              site = db.execute("SELECT name,url,builtin_code,enabled FROM custom_sites").fetchall()
              assert len(site) == 1 and site[0]["builtin_code"] == "sgcc_portal" and site[0]["enabled"] == 1
              assert db.execute("SELECT COUNT(*) FROM keywords").fetchone()[0] > 30
              for table in ("tenders", "runs", "sgcc_documents", "sgcc_packages"):
                  assert db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0] == 0, table
          for key in ("schedule", "recipient", "smtp_host", "smtp_port", "smtp_user", "smtp_from",
                      "wecom_corp_id", "wecom_callback_token", "wecom_encoding_aes_key",
                      "wecom_admin_users", "wecom_public_url", "wecom_webhook"):
              assert setting(key, secret=key in {"wecom_corp_id", "wecom_callback_token", "wecom_encoding_aes_key", "wecom_webhook"}) == "", key
          assert setting("wecom_push_enabled") == "0"
          PY
      - name: Verify database backup and migration round-trip
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/platform.sqlite3"
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          export APP_SECRET="ci-migration-secret"
          python - <<'PY'
          from app.database import backup_database, connect, export_migration_bundle, import_migration_bundle, init_db, set_setting, setting
          init_db()
          assert backup_database(14).exists()
          with connect() as db:
              db.execute("INSERT INTO keywords(term) VALUES(?)", ("迁移测试",))
          set_setting("smtp_auth_code", "portable-secret", secret=True)
          bundle = export_migration_bundle()
          with connect() as db:
              db.execute("DELETE FROM keywords")
          set_setting("smtp_auth_code", "changed", secret=True)
          import_migration_bundle(bundle)
          with connect() as db:
              assert db.execute("SELECT COUNT(*) FROM keywords WHERE term=?", ("迁移测试",)).fetchone()[0] == 1
          assert setting("smtp_auth_code", secret=True) == "portable-secret"
          PY
      - name: Verify safe reset to initial state
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/reset.sqlite3"
          export BACKUP_DIR="$RUNNER_TEMP/reset-backups"
          export APP_SECRET="ci-reset-secret"
          python - <<'PY'
          import sqlite3
          from app.database import connect, init_db, reset_platform_state, set_setting, setting
          init_db()
          with connect() as db:
              db.execute("INSERT INTO keywords(term) VALUES('测试关键词')")
              db.execute("INSERT INTO custom_sites(name,url,created_at) VALUES('测试站点','https://example.com/notices','now')")
              db.execute("INSERT INTO tenders(fingerprint,source,title,url,published_date,notice_type,matched_terms,first_seen_at) VALUES('fp','source','title','https://example.com/1','2026-01-01','公告','测试','now')")
              db.execute("INSERT INTO runs(started_at,target_date,status) VALUES('now','2026-01-01','success')")
          set_setting("admin_username", "keeper")
          set_setting("admin_password", "strong-password", secret=True)
          set_setting("backup_schedule", "03:10")
          set_setting("backup_retention_days", "30")
          set_setting("schedule", "08:00")
          set_setting("smtp_auth_code", "mail-secret", secret=True)
          set_setting("wecom_webhook", "webhook-secret", secret=True)
          rollback = reset_platform_state()
          assert rollback.exists()
          with sqlite3.connect(rollback) as backup:
              assert backup.execute("SELECT COUNT(*) FROM tenders").fetchone()[0] == 1
          with connect() as db:
              site = db.execute("SELECT builtin_code,enabled FROM custom_sites").fetchall()
              assert len(site) == 1 and site[0]["builtin_code"] == "sgcc_portal" and site[0]["enabled"] == 1
              assert db.execute("SELECT COUNT(*) FROM keywords").fetchone()[0] > 30
              for table in ("tenders", "runs", "sgcc_documents", "sgcc_packages"):
                  assert db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0] == 0
          assert setting("admin_username") == "keeper"
          assert setting("admin_password", secret=True) == "strong-password"
          assert setting("backup_schedule") == "03:10"
          assert setting("backup_retention_days") == "30"
          assert setting("schedule") == ""
          assert setting("smtp_auth_code", secret=True) == ""
          assert setting("wecom_webhook", secret=True) == ""
          PY
      - name: Verify dashboard template
        run: python -c "from jinja2 import Environment, FileSystemLoader; Environment(loader=FileSystemLoader('app/templates')).get_template('index.html')"
      - name: Verify multiple email recipients
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from app.emailing import normalize_recipients
          from app.runner import send_report

          assert normalize_recipients("first@example.com；Second@example.com\nfirst@example.com") == [
              "first@example.com", "Second@example.com"
          ]
          for invalid in ("invalid", "first@example.com\nBcc: hidden@example.com", "Name <first@example.com>"):
              try:
                  normalize_recipients(invalid)
              except ValueError:
                  pass
              else:
                  raise AssertionError(invalid)

          config = {"host": "smtp.example.com", "port": "465", "user": "sender@example.com", "from": "", "auth_code": "secret"}
          recipients = ["first@example.com", "second@example.com"]
          with patch("app.runner.smtplib.SMTP_SSL") as smtp_ssl:
              send_report(recipients, "2026-08-10", [], [], config)
              server = smtp_ssl.return_value.__enter__.return_value
              message = server.send_message.call_args.args[0]
              assert server.send_message.call_args.kwargs["to_addrs"] == recipients
              assert str(message["To"]) == "first@example.com, second@example.com"
          PY
      - name: Verify relevance scoring and schema migration
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/relevance.sqlite3"
          python - <<'PY'
          from app.database import connect, init_db
          from app.matching import evaluate_relevance, expanded_terms, parse_terms

          init_db()
          with connect() as db:
              columns = {row["name"] for row in db.execute("PRAGMA table_info(tenders)")}
          assert {"relevance_score", "relevance_level", "match_reason", "excerpt"} <= columns
          assert "系统开发" in expanded_terms(["软件开发"])
          result = evaluate_relevance("业务平台建设服务", "项目包括软件开发与应用实施", ["软件开发"], [])
          assert result.score >= 20 and result.level in {"高相关", "可能相关"}
          excluded = evaluate_relevance("软件开发与保洁外包", "", ["软件开发"], ["保洁外包"])
          assert excluded.score < result.score
          assert parse_terms("保洁外包；食堂服务\n保洁外包") == ["保洁外包", "食堂服务"]
          PY
      - name: Verify fixed SGCC collector routing
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/dedicated-routing.sqlite3"
          python - <<'PY'
          from unittest.mock import patch
          from app.database import connect, init_db
          from app.runner import collect_enabled_sites

          init_db()
          with connect() as db:
              db.execute("INSERT INTO keywords(term) VALUES('软件开发')")
          with patch("app.runner.collect_sgcc_portal", return_value=([], "")) as sgcc:
              collect_enabled_sites("2026-08-09")
          sgcc.assert_called_once_with("2026-08-09", ["软件开发"], [])
          PY
      - name: Verify scheduled email and manual 24-hour delivery rules
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/delivery-rules.sqlite3"
          export APP_SECRET="ci-delivery-rules"
          python - <<'PY'
          from datetime import datetime
          from unittest.mock import patch
          from app.database import connect, init_db, set_setting
          from app.main import build_recent_24h_report
          from app.runner import collect_enabled_sites

          init_db()
          target = "2026-08-09"
          with connect() as db:
              db.execute("INSERT INTO keywords(term) VALUES('软件开发')")
              db.execute("""INSERT INTO tenders(fingerprint,source,title,url,published_date,notice_type,matched_terms,first_seen_at,relevance_score,relevance_level,match_reason,excerpt)
                  VALUES('existing','测试来源','软件开发服务','https://example.com/1',?,'公告','软件开发',?,60,'高相关','标题核心词','')""",
                  (target, datetime.now().astimezone().isoformat(timespec="seconds")))
          set_setting("recipient", "recipient@example.com")
          set_setting("smtp_user", "sender@example.com")
          set_setting("smtp_auth_code", "secret", secret=True)
          with patch("app.runner.collect_sgcc_portal", return_value=([], "")), patch("app.runner.send_report") as send_report:
              collect_enabled_sites(target, send_email=True)
              assert len(send_report.call_args.args[2]) == 1
          with patch("app.runner.collect_sgcc_portal", return_value=([], "")), patch("app.runner.send_report") as send_report:
              collect_enabled_sites(target, send_email=False)
              send_report.assert_not_called()
          report, total = build_recent_24h_report()
          assert total == 1 and "软件开发服务" in report
          from app.main import run_assistant_command
          with patch("app.runner.send_wecom_robot_message"):
              response = run_assistant_command("24")
              assert "24" in response or "已手动推送" in response
          PY
      - name: Verify health endpoint
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/health.sqlite3"
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              assert client.get('/healthz').status_code == 200
          PY
